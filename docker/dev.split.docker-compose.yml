networks:
  langflow-dev:

services:
  postgres:
    image: postgres:16-trixie
    environment:
      POSTGRES_USER: langflow
      POSTGRES_PASSWORD: langflow
      POSTGRES_DB: langflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - langflow-dev

  backend:
    build:
      context: ..
      dockerfile: docker/dev.backend.Dockerfile
    volumes:
      # Mount only src/ — .venv stays inside the container (built at image build time)
      - ../src:/app/src
    ports:
      - "7860:7860"
    environment:
      - LANGFLOW_DATABASE_URL=postgresql://langflow:langflow@postgres:5432/langflow
      - LANGFLOW_CONFIG_DIR=/var/lib/langflow
      - LANGFLOW_AUTO_LOGIN=true
      # LangSmith — map từ LANGSMITH_* trong .env sang LANGCHAIN_* mà Langflow cần
      - LANGCHAIN_API_KEY=${LANGSMITH_API_KEY}
      - LANGCHAIN_PROJECT=${LANGSMITH_PROJECT:-Langflow}
      - LANGCHAIN_ENDPOINT=${LANGSMITH_ENDPOINT}
      - LANGCHAIN_TRACING_V2=true
      # Third-party API keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - langflow-dev

  frontend:
    build:
      context: ..
      dockerfile: docker/dev.frontend.Dockerfile
    volumes:
      # Mount entire frontend src so Vite HMR picks up all file changes
      - ../src/frontend:/app
      # Named volume protects node_modules installed at build time from being
      # overwritten by the bind mount above
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      # Routes /api/* requests from Vite dev server to the backend container
      - VITE_PROXY_TARGET=http://backend:7860
    depends_on:
      - backend
    networks:
      - langflow-dev

volumes:
  postgres_data:
  frontend_node_modules:
